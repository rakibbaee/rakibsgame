const SCH='মায়ের দোয়া স্কুল';
const BN="'Hind Siliguri','Noto Sans Bengali','Nirmala UI','Bangla Sangam MN','Vrinda',system-ui,sans-serif";
try{document.fonts.load("700 16px 'Hind Siliguri'",BUS)}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(5,'0');
const score=()=>Math.floor(dist/10)+coins*10;
const mkB=(a,b,c,d)=>{const r=[];let x=0;while(x<W){const w=rnd(c,d);r.push([x,w,rnd(a,b)]);x+=w+rnd(0,8)}return r};
const B1=mkB(70,170,40,80),B2=mkB(30,100,50,100);
const rr=(x,y,w,h,r,c)=>{ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()};
const dot=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill()};

function reset(){obs=[];cns=[];dist=0;runT=0;coins=0;speed=300;gap=380;since=0;P.h=0;P.vy=0;P.slide=0;P.duck=false;shake=0;state='play'}
function start(){if(state==='ready'||(state==='over'&&overT>.5))reset()}
function jump(){if(state==='play'&&P.h<=0){P.vy=860;P.slide=0}}
function slide(){if(state!=='play')return;if(P.h>0)P.vy=Math.min(P.vy,-500);else P.slide=.65}

function spawn(){
 const pool=['cone','cone3','crate','wide','stack'];
 if(runT>10)pool.push('drone','drone');
 if(runT>8)pool.push('bus');
 const k=pick(pool),x=W+60;let o;
 if(k==='cone')o={k,x,w:30,h:46};
 else if(k==='cone3')o={k,x,w:104,h:46};
 else if(k==='crate')o={k,x,w:48,h:46};
 else if(k==='wide')o={k,x,w:96,h:46};
 else if(k==='stack')o={k,x,w:48,h:92};
 else if(k==='bus')o={k,x,w:150,h:84};
 else o={k,x,w:56,h:30};
 o.y=k==='drone'?GY-92:GY-o.h;
 obs.push(o);
 gap=speed*.75+rnd(230,420);
 const r=Math.random();
 if(k==='drone'){for(let i=0;i<4;i++)cns.push({x:x+4+i*28,y:GY-22})}
 else if(r<.5){const sp=Math.max(30,(o.w+10)/4);for(let i=0;i<5;i++)cns.push({x:x+o.w/2-2*sp+i*sp,y:GY-58-Math.sin(Math.PI*i/4)*(o.h>60?78:62)})}
 else if(r<.8){const cx=x+gap/2;for(let i=0;i<4;i++)cns.push({x:cx+i*30,y:GY-30})}
}

function update(dt){
 if(shake>0)shake-=dt;
 if(state==='ready'){dist+=60*dt;return}
 if(state==='over'){overT+=dt;return}
 runT+=dt;speed=300+Math.min(400,runT*8);
 const dx=speed*dt;dist+=dx;
 if(P.slide>0)P.slide-=dt;
 if(P.h>0||P.vy>0){P.vy-=G*dt;if(down&&P.vy<0)P.vy-=3000*dt;P.h+=P.vy*dt;if(P.h<=0){P.h=0;P.vy=0}}
 P.duck=P.h<=0&&(down||P.slide>0);
 since+=dx;if(since>=gap){since=0;spawn()}
 for(const o of obs)o.x-=dx;
 for(const c of cns)c.x-=dx;
 const ph=P.duck?46:104,pw=P.duck?60:30,bx=PX-pw/2+(P.duck?8:0),by=GY-P.h-ph,m=6;
 for(const o of obs){
  if(bx+m<o.x+o.w&&bx+pw-m>o.x&&by+m<o.y+o.h&&by+ph-m>o.y){
   state='over';shake=.35;overT=0;const s=score();
   if(s>best){best=s;try{localStorage.setItem('roaddash_best',best)}catch(e){}}
   return;
  }
 }
 for(const c of cns){if(!c.d&&Math.abs(c.x-(bx+pw/2))<pw/2+11&&c.y+11>by&&c.y-11<by+ph){c.d=true;coins++}}
 obs=obs.filter(o=>o.x+o.w>-40);cns=cns.filter(c=>!c.d&&c.x>-40);
}

function layer(arr,col,spd){
 const ox=-((dist*spd)%W);ctx.fillStyle=col;
 for(let r=0;r<2;r++)for(const b of arr)ctx.fillRect(ox+r*W+b[0],GY-b[2],b[1],b[2]);
}

function drawObs(o){
 if(o.k!=='drone'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(o.x+o.w/2,GY+3,o.w/2,5,0,0,6.3);ctx.fill()}
 if(o.k==='cone'||o.k==='cone3'){
  const n=o.k==='cone'?1:3;
  for(let i=0;i<n;i++){
   const cx=o.x+15+i*37;
   rr(cx-15,GY-6,30,6,2,'#2a2f6b');
   ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.moveTo(cx-12,GY-6);ctx.lineTo(cx,GY-46);ctx.lineTo(cx+12,GY-6);ctx.fill();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-8.4,GY-18);ctx.lineTo(cx+8.4,GY-18);ctx.lineTo(cx+5.4,GY-28);ctx.lineTo(cx-5.4,GY-28);ctx.fill();
  }
 }else if(o.k==='bus'){
  const x=o.x,y=o.y;
  rr(x,y,150,72,10,'#1fa35a');
  ctx.fillStyle='#ffc61a';ctx.fillRect(x+4,y+3,142,4);
  rr(x+6,y+10,24,36,4,'#cfe9ff');
  for(let i=0;i<4;i++)rr(x+36+i*27,y+10,22,22,3,'#cfe9ff');
  rr(x+34,y+36,112,24,5,'#ffd23f');
  ctx.font='700 15px '+BN;ctx.fillStyle='#b3122e';ctx.textAlign='center';ctx.fillText(BUS,x+90,y+54,104);
  dot(x+5,y+54,4,'#fff7b0');ctx.fillStyle='#444';ctx.fillRect(x-2,y+66,12,6);
  for(const wx of[36,118]){dot(x+wx,GY-13,13,'#16131f');dot(x+wx,GY-13,5,'#9aa0b5')}
 }else if(o.k==='drone'){
  const x=o.x,y=o.y+Math.sin(t*8+o.x*.02)*2.5;
  ctx.fillStyle='#cfd3ff';ctx.fillRect(x+2+(Math.floor(t*30)%2)*4,y+2,o.w-8,3);
  ctx.fillStyle='#8a90b8';ctx.fillRect(x+26,y+4,4,6);
  rr(x+6,y+8,44,20,10,'#2f6bd8');
  dot(x+40,y+18,5,'#ffd23f');dot(x+41,y+18,2,'#1c1424');
  dot(x+14,y+18,2.5,Math.floor(t*4)%2?'#ff4f5a':'#7a2030');
 }else{
  const cols=o.w/48,rows=o.h/46;
  ctx.lineWidth=3;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
   const x=o.x+c*48,y=GY-(r+1)*46;
   ctx.fillStyle='#b9783a';ctx.fillRect(x+1,y+1,46,44);
   ctx.strokeStyle='#7a4a1f';ctx.strokeRect(x+2.5,y+2.5,43,41);
   ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.lineTo(x+44,y+42);ctx.stroke();
  }
 }
}

function drawCoin(c){
 const sw=Math.max(.25,Math.abs(Math.cos(t*5+c.x*.02)));
 ctx.fillStyle='#ffd23f';ctx.strokeStyle='#c9961a';ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(c.x,c.y,10*sw,10,0,0,6.3);ctx.fill();ctx.stroke();
 ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.ellipse(c.x,c.y,4*sw,5,0,0,6.3);ctx.fill();
}

function face(cx,cy,h,rot){
 const I=(state==='over'&&FACE2.complete&&FACE2.naturalWidth)?FACE2:FACE;
 if(I.complete&&I.naturalWidth){const w=h*I.naturalWidth/I.naturalHeight;ctx.save();ctx.translate(cx,cy+h/2);ctx.rotate(rot);ctx.drawImage(I,-w/2,-h,w,h);ctx.restore()}
 else dot(cx,cy,h*.35,'#f2c9a0');
}
function drawPlayer(){
 const air=P.h>0;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(PX,GY+4,30*(1-Math.min(.5,P.h/260)),6,0,0,6.3);ctx.fill();
 ctx.save();ctx.translate(PX,GY-P.h);
 const sw=(air||state==='over')?0:Math.sin(t*18);
 const leg=(hx,hy,a,len,col)=>{ctx.save();ctx.translate(hx,hy);ctx.rotate(a);ctx.fillStyle=col;ctx.fillRect(-6,0,12,len);ctx.fillStyle='#fff';ctx.fillRect(-6,len-5,19,6);ctx.restore()};
 if(P.duck){
  leg(-8,-18,sw*.8,18,'#1f2354');leg(-8,-18,-sw*.8,18,'#2a2f6b');
  rr(-36,-40,14,26,5,'#2b2250');rr(-22,-42,42,26,10,'#ff7a2f');
  face(24,-34,30,0);
 }else{
  leg(0,-38,air?.5:sw*.9,38,'#1f2354');
  rr(-26,-72,16,28,5,'#2b2250');
  rr(-5,-80,14,10,3,'#b97a55');
  rr(-14,-74,28,40,8,'#ff7a2f');
  leg(0,-38,air?-.8:-sw*.9,38,'#2a2f6b');
  ctx.save();ctx.translate(0,-66);ctx.rotate(air?-2.4:sw*1.1);rr(-5,0,10,28,4,'#ff9a55');ctx.restore();
  face(3,-91,38,sw*.06);
 }
 ctx.restore();
}

function txt(s,x,y,sz,col,w='bold'){ctx.font=w+' '+sz+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(s,x,y)}
function panel(){ctx.fillStyle='rgba(12,6,32,.74)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(220,95,360,200,18);else ctx.rect(220,95,360,200);ctx.fill()}

function school(){
 const ox=-((dist*.2)%W);
 for(let r=0;r<2;r++){
  const x=ox+r*W+470;
  ctx.fillStyle='#f0cf7a';ctx.fillRect(x,GY-110,190,110);
  ctx.fillStyle='#b5473a';ctx.fillRect(x-6,GY-120,202,10);
  ctx.fillStyle='#ddd';ctx.fillRect(x+168,GY-172,3,52);
  ctx.fillStyle='#0c6b3a';ctx.fillRect(x+171,GY-172,28,17);dot(x+184,GY-163.5,5,'#e0312a');
  rr(x+25,GY-102,140,28,4,'#12633a');
  ctx.font='700 15px '+BN;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(SCH,x+95,GY-83,126);
  for(const wx of[14,44,126,156])rr(x+wx,GY-66,22,24,3,'#8fd0ff');
  rr(x+80,GY-42,30,42,[15,15,0,0],'#6b3a1e');
  ctx.fillStyle='#a89f91';ctx.fillRect(x+72,GY-6,46,6);
 }
}
function draw(){
 ctx.setTransform(2,0,0,2,0,0);
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);
 const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#241046');g.addColorStop(.6,'#7a2b8c');g.addColorStop(1,'#ff8a4c');
 ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,GY+30);
 dot(570,GY-20,80,'#ffd070');
 layer(B1,'#4a2278',.08);layer(B2,'#1d0f3a',.2);school();
 const off=(dist*.6)%280;
 for(let i=-1;i<4;i++){
  const x=i*280-off+140;
  ctx.fillStyle='#6b5f99';ctx.fillRect(x-2,GY-110,4,110);ctx.fillRect(x-2,GY-110,22,4);
  ctx.globalAlpha=.25;dot(x+20,GY-102,16,'#ffe08a');ctx.globalAlpha=1;dot(x+20,GY-102,5,'#ffe08a');
 }
 ctx.fillStyle='#554f78';ctx.fillRect(-30,GY,W+60,10);
 ctx.fillStyle='#3a3550';ctx.fillRect(-30,GY+10,W+60,H-GY);
 ctx.fillStyle='#ff4fa3';ctx.fillRect(-30,GY,W+60,3);
 ctx.fillStyle='#f4f0ff';for(let x=-(dist%100);x<W;x+=100)ctx.fillRect(x,GY+58,50,4);
 obs.forEach(drawObs);cns.forEach(drawCoin);drawPlayer();
 ctx.restore();
 if(state==='over'&&overT<.25){ctx.fillStyle='rgba(255,60,60,'+(.28*(1-overT/.25))+')';ctx.fillRect(0,0,W,H)}
 ctx.font='bold 22px ui-monospace,Menlo,Consolas,monospace';
 ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(pad(score()),20,38);
 ctx.textAlign='right';ctx.fillText('HI '+pad(best),W-20,38);
 ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.fillText('\u25CF '+coins,400,38);
 if(state==='ready'){
  panel();txt('ROAD DASH',400,148,40,'#ffd23f');
  txt('Space / \u2191 / tap to jump',400,190,18,'#fff','normal');
  txt('\u2193 / swipe down to slide',400,216,18,'#fff','normal');
  ctx.globalAlpha=.65+.35*Math.sin(t*5);txt('Tap / Space to start',400,264,22,'#17e0c8');ctx.globalAlpha=1;
 }else if(state==='over'){
  panel();txt('GAME OVER',400,148,38,'#ff5a7a');
  txt('Score '+pad(score())+'   Best '+pad(best),400,190,20,'#fff');
  txt(coins+' coins',400,216,18,'#ffd23f','normal');
  if(overT>.5){ctx.globalAlpha=.65+.35*Math.sin(t*5);txt('Tap / Space to retry',400,264,22,'#17e0c8');ctx.globalAlpha=1}
 }
}

addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){state==='play'?jump():start()}
 else if(k==='ArrowDown'||k==='s'||k==='S'){if(!down&&P.h>0)slide();down=true}
 else if(k==='Enter')start();
 else return;
 e.preventDefault();
});
addEventListener('keyup',e=>{if(['ArrowDown','s','S'].includes(e.key))down=false});

let sx=0,sy=0,sd=false,moved=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true;moved=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.focus()});
cv.addEventListener('pointermove',e=>{
 if(!sd)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))>24){moved=true;sx=e.clientX;sy=e.clientY;if(dy<0&&Math.abs(dy)>=Math.abs(dx))jump();else if(dy>0&&Math.abs(dy)>=Math.abs(dx))slide()}
});
cv.addEventListener('pointerup',()=>{if(sd&&!moved){state==='play'?jump():start()}sd=false});
cv.addEventListener('pointercancel',()=>{sd=false});

let last=0;
function frame(ts){
 const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;
 update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
